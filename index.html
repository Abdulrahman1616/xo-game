<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة إكس أو</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 10px; }
    .controls {
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      border-radius: 5px;
      margin: 0 5px;
    }
    button.active {
      border-color: #8a2be2;
      background-color: #333;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
    }
    .cell {
      width: 100px;
      height: 100px;
      background-color: #111111;
      border: 2px solid #333333;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .cell.x { color: #8a2be2; } /* بنفسجي */
    .cell.o { color: #ff0000; } /* أحمر */
    .status {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      height: 30px;
    }
  </style>
</head>
<body>

  <h1>لعبة إكس أو</h1>

  <div class="controls">
    <button id="btnPvp" class="active" onclick="setMode('pvp')">لاعب ضد لاعب</button>
    <button id="btnAi" onclick="setMode('ai')">لاعب ضد الذكاء الاصطناعي</button>
    <button onclick="resetGame()">إعادة اللعب</button>
  </div>

  <div class="board" id="board">
    <div class="cell" onclick="handleClick(0)"></div>
    <div class="cell" onclick="handleClick(1)"></div>
    <div class="cell" onclick="handleClick(2)"></div>
    <div class="cell" onclick="handleClick(3)"></div>
    <div class="cell" onclick="handleClick(4)"></div>
    <div class="cell" onclick="handleClick(5)"></div>
    <div class="cell" onclick="handleClick(6)"></div>
    <div class="cell" onclick="handleClick(7)"></div>
    <div class="cell" onclick="handleClick(8)"></div>
  </div>

  <div class="status" id="status">دور اللاعب: X</div>

  <script>
    let boardState = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let isGameActive = true;
    let gameMode = "pvp"; // 'pvp' أو 'ai'

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function setMode(mode) {
      gameMode = mode;
      document.getElementById('btnPvp').classList.toggle('active', mode === 'pvp');
      document.getElementById('btnAi').classList.toggle('active', mode === 'ai');
      resetGame();
    }

    function handleClick(index) {
      if (boardState[index] !== "" || !isGameActive) return;

      makeMove(index, currentPlayer);

      if (isGameActive && gameMode === "ai" && currentPlayer === "O") {
        setTimeout(aiMove, 400);
      }
    }

    function makeMove(index, player) {
      boardState[index] = player;
      const cell = document.getElementsByClassName('cell')[index];
      cell.textContent = player;
      cell.classList.add(player.toLowerCase());

      if (checkWin(player)) {
        document.getElementById('status').textContent = `مبروك الفائز هو: ${player}! 🎉`;
        isGameActive = false;
        return;
      }

      if (boardState.every(cell => cell !== "")) {
        document.getElementById('status').textContent = "تعادل!";
        isGameActive = false;
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      document.getElementById('status').textContent = `دور اللاعب: ${currentPlayer}`;
    }

    function aiMove() {
      let emptyIndices = boardState.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
      if (emptyIndices.length > 0) {
        let randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        makeMove(randomIndex, "O");
      }
    }

    function checkWin(player) {
      return winningConditions.some(condition => {
        return condition.every(index => boardState[index] === player);
      });
    }

    function resetGame() {
      boardState = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      isGameActive = true;
      document.getElementById('status').textContent = "دور اللاعب: X";
      const cells = document.getElementsByClassName('cell');
      Array.from(cells).forEach(cell => {
        cell.textContent = "";
        cell.classList.remove('x', 'o');
      });
    }
  </script>
</body>
</html>
